spring.application.name=Gestion-du-stock
server.port=8095

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.datasource.username=sarra
spring.datasource.password=sarra
spring.datasource.url=jdbc:h2:~/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
sendgrid.api.key=${SENDGRID_API_KEY}

#eureka
eureka.client.backup-registry-with-eureka=true
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=http://host.docker.internal:8761/eureka/
eureka.client.fetch-registry=true


spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888
# Expose tous les endpoints actuator
management.endpoints.web.exposure.include=refresh
#les endpoints actuator

# RabbitMQ (si tu l utilises)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Nom de la queue RabbitMQ
rabbitmq.queue.name=facture_queue