# Server Configuration
server.port=8083

# Application Name
spring.application.name=ReservationMS

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/reservationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable SQL auto initialization
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.esprit.ms.reservationms=DEBUG
logging.level.org.hibernate.SQL=DEBUG



# RabbitMQ Configuration (Add these)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Config Server
#spring.cloud.config.import-check.enabled=false
#spring.cloud.config.fail-fast=true
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888